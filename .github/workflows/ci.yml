name: CI
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[test]'
      - name: Unit tests
        run: pytest -q
  compose-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: eventhub
      POSTGRES_USER: eventhub
      POSTGRES_PASSWORD: smoke_password_for_ci_only
      DATABASE_URL: postgresql+asyncpg://eventhub:smoke_password_for_ci_only@postgres:5432/eventhub
      ADMIN_API_KEY: smoke_admin_key_at_least_20_characters
      CALLBACK_SHARED_KEY: smoke_demo_callback_key
    steps:
      - uses: actions/checkout@v4
      - name: Prepare CI environment
        run: |
          cat > .env <<EOF
          POSTGRES_DB=$POSTGRES_DB
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          DATABASE_URL=$DATABASE_URL
          ADMIN_API_KEY=$ADMIN_API_KEY
          CALLBACK_SHARED_KEY=$CALLBACK_SHARED_KEY
          EOF
      - name: Compose build and start
        run: |
          docker compose up -d --build
          docker compose ps
      - name: Smoke test
        run: python3 scripts/smoke.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop
        if: always()
        run: docker compose down -v
